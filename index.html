<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a1628;
      font-family: -apple-system, 'PingFang SC', sans-serif;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #000;
      border-radius: 55px;
      padding: 12px;
      box-shadow: 0 0 0 4px #1a3a5c, 0 20px 80px rgba(100, 180, 255, .15);
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 45px;
      overflow: hidden;
      background: linear-gradient(160deg, #a8d8f0 0%, #7ec8e3 30%, #1a3a5c 100%);
      background-image: url('./assets/images/wallpaper.jpg');
      background-size: cover;
      background-position: center;
      color: #fff;
    }
    .screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.02) 40%, rgba(0,0,0,.25) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 18px 28px 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
      position: relative;
      z-index: 5;
    }
.lock-screen, .home-screen {
  position: absolute;
  inset: 0;
  padding: 60px 20px 0;
  transition:
    transform .65s cubic-bezier(.25,.8,.25,1),
    opacity .5s ease,
    filter .5s ease;
}

.lock-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 92px;
  gap: 2px;
  background-image: url('./assets/images/photo3.jpg');
background-size: cover;
background-position: center;
  z-index: 2;
}
    .home-screen {
      transform: translateY(100%);
      opacity: 0;
      padding-bottom: 120px;
      overflow-y: auto;
    }
.screen.unlocked .lock-screen {
  transform: translateY(-12%) scale(1.06);
  opacity: 0;
  filter: blur(6px);
  pointer-events: none;
}
    .screen.unlocked .home-screen {
      transform: translateY(0);
      opacity: 1;
    }

  .lock-icon-top {
  position: absolute;
  top: 60px;
  font-size: 22px;
  opacity: .9;
}
.lock-bottom {
  position: absolute;
  bottom: 42px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 38px;
}.lock-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.12);
  display: grid;
  place-items: center;
  font-size: 22px;
  cursor: pointer;
  transition: transform .15s, background .15s;
}

.lock-btn:active {
  transform: scale(.92);
  background: rgba(255,255,255,.28);
}

.lock-hint {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.75);
  letter-spacing: 2px;
  animation: hintFade 2s ease-in-out infinite;
}

@keyframes hintFade {
  0%,100% { opacity: .35; }
  50% { opacity: .9; }
}
.lock-time {
  font-size: 88px;
  font-weight: 200;
  letter-spacing: -3px;
  line-height: 1;
  color: #fff;
  text-shadow: 0 2px 24px rgba(0,0,0,.35);
  margin-bottom: 0;
}
  .lock-date {
  font-size: 17px;
  font-weight: 500;
  margin-bottom: -8px;
}

    .hint {
      margin-top: 40px;
      font-size: 15px;
      font-weight: 600;
      color: #a8d8f0;
      letter-spacing: 1px;
    }

    .hint-sub {
      font-size: 13px;
      opacity: .6;
    }

    /* ===== 主屏布局 ===== */
    .home-top {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 14px;
      margin-bottom: 18px;
    }

    .memo-big {
      grid-row: 1 / 3;
      grid-column: 1 / 2;
      background: rgba(255, 214, 102, .25);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 22px;
      padding: 16px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .memo-big .w-header {
      font-size: 13px;
      font-weight: 600;
      color: #ffd966;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .memo-big .w-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,.4);
    }

    .memo-big .w-date {
      font-size: 13px;
      opacity: .8;
      color: #fff;
    }
    .memo-big,
    .small-glass {
      border-radius: 22px;
      transition: transform .15s;
    }
    .memo-big:active,
    .small-glass:active {
      transform: scale(.97);
    }
    .small-glass {
      background: rgba(255, 255, 255, .18);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 68px;
      cursor: pointer;
    }

    .small-glass .w-header {
      font-size: 11px;
      font-weight: 600;
      opacity: .85;
    }

    .small-glass .w-body {
      font-size: 26px;
      font-weight: 300;
      line-height: 1;
    }

    .cal-widget { color: #ff8a8a; }
    .photos-widget { color: #a8d8f0; }

    /* 第二排右：Google + Safari */
    .row-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-left: calc(50% + 7px);
      margin-bottom: 18px;
    }

    .row-two .small-glass {
      min-height: 68px;
    }

    /* 第三排：4 个圆角图标 */
    .icon-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .app-icon {
      text-align: center;
      cursor: pointer;
    }

.app-icon .icon-box {
  width: 60px;
  height: 60px;
  margin: 0 auto 6px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 28px;
  font-weight: 700;
  background: rgba(255,255,255,.2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.18);
  overflow: hidden;
  color: #fff;
  transition: transform .15s;
}

.app-icon:active .icon-box {
  transform: scale(.9);
}
    .app-icon .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-icon span {
      font-size: 11px;
      color: #fff;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }

    /* Dock 栏 */
  .dock {
  position: absolute;
  bottom: 22px;
  left: 14px;
  right: 14px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding: 12px 16px;
  border-radius: 34px;
  background: rgba(255,255,255,.16);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,.14);
}
.dock-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: rgba(255, 255, 255, .25);
  cursor: pointer;
  color: #fff;
  overflow: hidden;
  transition: transform .15s;
}

.dock-icon:active {
  transform: scale(.9);
}
    .dock-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 弹窗 */
    .app-modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 30, 60, .92);
      backdrop-filter: blur(20px);
    padding: 10px 24px 24px;
      display: none;
      z-index: 10;
      overflow-y: auto;
    }

    .app-modal.show { display: block; }

    .app-modal h2 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #a8d8f0;
    }

    .app-modal p {
      font-size: 15px;
      line-height: 1.8;
      color: #c8e0f0;
      margin-bottom: 8px;
    }

    .app-modal .song-item {
      padding: 14px 16px;
      background: rgba(168, 216, 240, .1);
      border-radius: 14px;
      margin-bottom: 10px;
      border-left: 3px solid #7ec8e3;
    }

    .app-modal .song-item.active {
      background: rgba(168, 216, 240, .25);
      border-left-color: #a8d8f0;
    }

   .app-modal.openIos .ios-page.photo-page,
.photo-page {
  background: #fff !important;
}
 /* 照片图片 */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-top: 12px;
}

.photo-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 0;
}

    /* 音乐播放器 */
    .music-player {
      background: rgba(168, 216, 240, .12);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-top: 12px;
    }

    .music-player .cover {
      width: 160px;
      height: 160px;
      border-radius: 20px;
      margin: 0 auto 16px;
      background: rgba(168, 216, 240, .2);
      display: grid;
      place-items: center;
      font-size: 60px;
      overflow: hidden;
    }

    .music-player .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .music-player .song-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .music-player .song-artist {
      font-size: 13px;
      opacity: .7;
      margin-bottom: 16px;
    }

    .music-player audio {
      width: 100%;
      margin-top: 8px;
    }

 .app-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 60px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.app-back {
  background: none;
  border: none;
  color: #4da8e8;
  font-size: 16px;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
}

.app-topbar .app-title {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}/* 文件夹图标（外面看是 3 个小图叠在一起） */
.folder-box {
  display: grid !important;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 3px;
  padding: 8px;
  background: rgba(255, 255, 255, .25) !important;
  backdrop-filter: blur(14px);
}

.folder-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 4px;
}

.folder-box img:nth-child(1) { grid-column: 1; grid-row: 1; }
.folder-box img:nth-child(2) { grid-column: 2; grid-row: 1; }
.folder-box img:nth-child(3) { grid-column: 1; grid-row: 2; }






/* 文件夹弹出面板（底部卡片版） */
.folder-panel {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 40;
  background: rgba(0, 0, 0, .35);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 380px;
}
.folder-panel.show { display: flex; }
#notificationBanner.show-banner { top: 50px !important; }
.folder-card {
  width: 300px;
  background: rgba(255, 255, 255, .22);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(255, 255, 255, .25);
  border-radius: 34px;
  padding: 14px 18px 22px;
  text-align: center;
}
.folder-card .folder-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 18px;
  text-shadow: 0 1px 4px rgba(0,0,0,.4);
}

.folder-body {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.folder-app {
  text-align: center;
  cursor: pointer;
}

.folder-app .icon-box {
  width: 60px;
  height: 60px;
  margin: 0 auto 6px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .2);
  overflow: hidden;
}

.folder-app .icon-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.folder-app span {
  font-size: 11px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.5);
}
.app-body {/* ===== 日历 App ===== */
.cal-app {
  color: #fff;
}

.cal-header {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 22px;
  display: flex;
  align-items: baseline;
  gap: 4px;
  position: relative;
}

.cal-year {
  color: #ff3b30;
}

.cal-nav {
  margin-left: auto;
  display: flex;
  gap: 16px;
}

.cal-nav button {
  background: none;
  border: none;
  color: #ff3b30;
  font-size: 26px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 12px;
  opacity: .5;
  margin-bottom: 10px;
}

.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  gap: 4px 0;
}

.cal-day {
  padding: 10px 0;
  font-size: 16px;
  position: relative;
  cursor: pointer;
}

.cal-day.other-month {
  opacity: .25;
}

.cal-day.today {
  background: #ff3b30;
  color: #fff;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  line-height: 16px;
  margin: 0 auto;
  padding: 10px 0;
}

.cal-day.selected {
  background: rgba(255,255,255,.12);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  margin: 0 auto;
  padding: 10px 0;
}

.cal-day .dot {
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #a8d8f0;
}

.cal-events {
  margin-top: 28px;
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 16px;
}

.cal-event-date {
  font-size: 13px;
  opacity: .6;
  margin-bottom: 14px;
}

.cal-event-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.cal-event-bar {
  width: 3px;
  height: 40px;
  background: #4da8e8;
  border-radius: 2px;
  flex-shrink: 0;
}

.cal-event-title {
  font-size: 16px;
  margin-bottom: 4px;
}

.cal-event-time {
  font-size: 13px;
  opacity: .5;
}
    padding: 20px 20px 40px;
  padding-top: 60px !important;
  overflow-y: auto;
  height: calc(100% - 100px);
}



    @media (max-width: 430px) {
      .phone { width: 100vw; height: 100vh; border-radius: 0; padding: 0; }
      .screen { border-radius: 0; }
    } 
 /* ===== iOS 白色页面通用 ===== */
.ios-page {
  background: #fff;
  color: #000;
  min-height: 100%;
  margin: 0;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.ios-h1 { font-size: 34px; font-weight: 700; margin-bottom: 20px; color:#000; }
.ios-list { border-top: 1px solid #e5e5e5; }
.ios-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 4px;
  border-bottom: 1px solid #e5e5e5;
}
.ios-row-title { font-size: 17px; font-weight: 500; color:#000; }
.ios-row-title.red { color: #ff3b30; }
.ios-row-sub { font-size: 13px; color: #8e8e93; margin-top: 2px; }
.ios-row-time { font-size: 14px; color: #8e8e93; flex-shrink:0; margin-left:8px; }

/* ===== 信息头像 ===== */
.msg-row { gap: 12px; align-items: center; }
.msg-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  color: #fff; font-size: 16px; font-weight: 600;
  flex-shrink: 0;
  overflow: hidden;
}
.msg-avatar img { width:100%; height:100%; object-fit:cover; }

/* Kakao 聊天行（气泡 + 头像） */
.chat-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.chat-row.me {
  flex-direction: row-reverse;
}
.chat-avatar {
  width: 36px;
  height: 36px;
  border-radius: 14px;
  object-fit: cover;
  flex-shrink: 0;
}
/* ===== 聊天气泡 ===== */
.chat-page {
  display: flex; flex-direction: column;
  height: 100%;
  margin: -70px -24px -24px;
  background: #fff;
}
.chat-body {
  flex: 1; overflow-y: auto;
  padding: 20px 16px;
  display: flex; flex-direction: column; gap: 8px;
  background: #fff;
}
.chat-bubble {
  max-width: 70%; padding: 8px 14px;
  border-radius: 18px; font-size: 16px; line-height: 1.4;
}
.chat-bubble.them { background: #e5e5ea; color: #000; }
.chat-bubble.me { background: #0b84ff; color: #fff; }
.chat-bubble-wrap { display: flex; flex-direction: column; }
.chat-bubble-wrap.me { align-items: flex-end; }
.chat-bubble-wrap.them { align-items: flex-start; }
.chat-day {
  font-size: 11px; color: #8e8e93;
  text-align: center; margin: 10px 0;
  align-self: center;
}
.chat-input {
  padding: 10px 16px 24px;
  border-top: 1px solid #e5e5e5;
  background: #fff;
}
.chat-input input {
  width: 100%; padding: 10px 16px;
  border-radius: 20px; border: 1px solid #d1d1d6;
  font-size: 15px; outline: none;
}

/* ===== Kakao 聊天配色（浅灰蓝，参考真实 iOS Kakao） ===== */
.kakao-page { background: #c8d3dd; }
.kakao-page .chat-body { background: #c8d3dd; }
.kakao-page .chat-bubble.me { background: #fee500; color: #000; }
.kakao-page .chat-bubble.them { background: #fff; color: #000; }
.kakao-page .chat-input {
  background: #c8d3dd !important;
  border-top: none !important;
}
/* ===== 白色页面里顶栏适配 ===== */
.app-modal.openIos { background: #fff; }.app-modal.openIos:has(.photo-page) {
  padding: 0 !important;
}..app-modal.openIos.kakaoOpen {
  padding: 0;
  background: #c8d3dd;
  height: 100%;
  overflow: hidden;
}
.app-modal.openIos.kakaoOpen { background: #b2c7d9; }
.app-modal.openIos.kakaoOpen .app-body {
  background: #c8d3dd;
  padding: 0 !important;
  margin: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.app-modal.openIos .app-topbar {
  background: #fff !important;
  border-bottom-color: #e5e5e5 !important;
  padding-top: 60px !important; 
}
.app-modal.openIos .app-back { color: #0b84ff; }
.app-modal.openIos .app-title { color: #000; }
/* ===== 隐藏滚动条（保留滚动功能） ===== */
.app-modal,
.app-body,
.chat-body,
.home-screen,
.folder-panel,
.ios-page,
.chat-page {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.app-modal::-webkit-scrollbar,
.app-body::-webkit-scrollbar,
.chat-body::-webkit-scrollbar,
.home-screen::-webkit-scrollbar,
.folder-panel::-webkit-scrollbar,
.ios-page::-webkit-scrollbar,
.chat-page::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
/* Kakao 私聊页顶栏（和内容区同色，无缝） */
.app-modal.openIos.kakaoOpen .app-topbar {
  background: #c8d3dd !important;
  border-bottom: none !important;
  padding: 44px 20px 10px !important;
}
.app-modal.openIos.kakaoOpen .app-back,
.app-modal.openIos.kakaoOpen .app-title {
  color: #1a1a1a !important;
}/* ===== Kakao 私聊页 强制铺满 ===== */
.app-modal.openIos.kakaoOpen {
  padding: 0 !important;
  background: #c8d3dd !important;
  height: 100% !important;
  overflow: hidden !important;
}
.app-modal.openIos.kakaoOpen .app-topbar {
  background: #c8d3dd !important;
  border-bottom: none !important;
  padding: 44px 20px 10px !important;
}
.app-modal.openIos.kakaoOpen .app-body {
  background: #c8d3dd !important;
  padding: 0 !important;
  margin: 0 !important;
  width: 100% !important;

  padding: 16px 24px 4px;
  font-size: 14px; font-weight: 600; color: #000;
  flex-shrink: 0;
}
.gg-statusbar .icons { display: flex; align-items: center; gap: 6px; }
.gg-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px 10px; flex-shrink: 0;
}
.gg-nav .back {
  color: #0b84ff; font-size: 17px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 2px;
}
.gg-nav .avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: #4285F4; color: #fff;
  display: grid; place-items: center;
  font-size: 14px; font-weight: 700;
}
.gg-scroll {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.gg-scroll::-webkit-scrollbar { display: none; }
.gg-hero {
  text-align: center; margin: 20px 0 26px;
  font-size: 52px; font-weight: 600; letter-spacing: -2px;
}
.gg-search {
  margin: 0 16px 24px;
  display: flex; align-items: center; gap: 10px;
  border: 1px solid #d1d1d6; border-radius: 26px;
  padding: 12px 18px;
  font-size: 15px; color: #8e8e93;
}
.gg-shortcuts {
  display: flex; justify-content: space-around;
  padding: 0 12px 22px;
}
.gg-shortcut {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 12px; color: #333;
}
.gg-shortcut .ico {
  width: 52px; height: 52px; border-radius: 50%;
  background: #f2f2f7;
  display: grid; place-items: center;
  color: #4285F4; font-size: 22px;
}
.gg-recent-title {
  font-size: 13px; font-weight: 600; color: #8e8e93;
  padding: 6px 16px 4px;
  text-transform: uppercase; letter-spacing: .3px;
}
.gg-recent-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 15px; color: #000;
}
.gg-recent-row .clock { color: #8e8e93; }

// ===== 日历功能 =====
let now = new Date();
let calCurrentYear = now.getFullYear();
let calCurrentMonth = now.getMonth() + 1;
let calSelectedDay = now.getDate();

// 行程数据：key 是 "年-月-日"，value 是行程文字
const calEventsData = {
  '2026-10-15': { title: 'MCD打歌', time: '全天' },
  '2026-09-07': { title: '啾HBD', time: '全天' },
  '2025-02-24': { title: '出道', time: '全天' },
  '2026-10-17': { title: '出道600天❗', time: '全天' },
};
function renderCalendar() {
  const daysEl = document.getElementById('calDays');
  const monthEl = document.querySelector('.cal-month');
  const yearEl = document.querySelector('.cal-year');
  if (!daysEl) return;

  monthEl.textContent = calCurrentMonth;
  yearEl.textContent = calCurrentYear;

  const firstDay = new Date(calCurrentYear, calCurrentMonth - 1, 1).getDay();
  const daysInMonth = new Date(calCurrentYear, calCurrentMonth, 0).getDate();
  const daysInPrev = new Date(calCurrentYear, calCurrentMonth - 1, 0).getDate();

  let html = '';

  // 上个月的尾巴
  for (let i = firstDay - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month">${daysInPrev - i}</div>`;
  }

  // 本月
  const today = new Date();
  const isThisMonth = today.getFullYear() === calCurrentYear && (today.getMonth() + 1) === calCurrentMonth;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = `${calCurrentYear}-${String(calCurrentMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const hasEvent = calEventsData[dateKey];
    let cls = 'cal-day';
    if (isThisMonth && d === today.getDate()) cls += ' today';
    else if (d === calSelectedDay) cls += ' selected';

    html += `<div class="${cls}" data-day="${d}">${d}${hasEvent ? '<span class="dot"></span>' : ''}</div>`;
  }

  // 下个月的头
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month">${i}</div>`;
  }

  daysEl.innerHTML = html;

  // 更新下方行程
  const dateKey = `${calCurrentYear}-${String(calCurrentMonth).padStart(2, '0')}-${String(calSelectedDay).padStart(2, '0')}`;
  const event = calEventsData[dateKey];
  const eventDateEl = document.getElementById('calEventDate');
  const eventTitleEl = document.getElementById('calEventTitle');
  const eventTimeEl = document.querySelector('.cal-event-time');

  if (eventDateEl) {
    eventDateEl.textContent = `${calCurrentMonth}月${calSelectedDay}日`;
    eventTitleEl.textContent = event ? event.title : '没有时间表';
    eventTimeEl.textContent = event ? event.time : '';
  }

  // 点击日期
  daysEl.querySelectorAll('.cal-day:not(.other-month)').forEach(el => {
    el.addEventListener('click', () => {
      calSelectedDay = parseInt(el.dataset.day);
      renderCalendar();
    });
  });
}

// 切换月份
document.addEventListener('click', (e) => {
  if (e.target.id === 'calPrev') {
    calCurrentMonth--;
    if (calCurrentMonth < 1) { calCurrentMonth = 12; calCurrentYear--; }
    renderCalendar();
  }
  if (e.target.id === 'calNext') {
    calCurrentMonth++;
    if (calCurrentMonth > 12) { calCurrentMonth = 1; calCurrentYear++; }
    renderCalendar();
  }
});
